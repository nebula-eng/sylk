name: Bug 报告
description: 功能异常、引擎启动失败、界面或数据问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请**不要**粘贴真实 QQ 账号、群名、联系人、语音文件或转写文本。日志请先脱敏。
        如果问题涉及登录风控、账号安全或本地文件越权，按
        [SECURITY.md](https://github.com/nebula-eng/sylk/blob/main/SECURITY.md) 私下报告，不要开公开 issue。
  - type: input
    id: version
    attributes:
      label: Sylk 版本
      description: 设置 → 关于 里可以看到；或安装包文件名
      placeholder: x.y.z 或 Sylk_x.y.z_x64-setup.exe
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 23H2 / Windows 10 22H2
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 安装方式
      options:
        - GitHub Release 安装包
        - 源码 build.cmd 构建
        - 浏览器预览模式（npm run dev）
        - 不确定
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: 引擎接入方式
      options:
        - V8 兼容引擎包（便携 QQ）
        - 经典 NapCat 内嵌
        - 外部 OneBot 11 实例
        - 还没接引擎 / 不确定
    validations:
      required: true
  - type: input
    id: qq-version
    attributes:
      label: 本机 QQ 版本（可选）
      placeholder: 9.9.37-54395
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开 Sylk 开始，按顺序写清楚点了什么、看到了什么
      placeholder: |
        1. 打开 Sylk
        2. 点「自动查找本机引擎」
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
      placeholder: 预期出现二维码；实际停在「引擎启动失败」，提示……
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志或环境自检
      description: 登录页底部「引擎日志」或 设置 → 引擎 → 环境自检；也可以附上 %LOCALAPPDATA%\app.sylk.desktop\logs 里的日志。请先删掉账号、路径中的用户名等个人信息。
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索过现有 issue，没有重复
          required: true
        - label: 日志和截图里不包含真实账号、群名、联系人或语音内容
          required: true
