name: Release

# 打 tag 就出正式版：先跑检查，再编译 Windows 安装包，挂到 GitHub Releases。
# 发布包**不包含**第三方引擎（NapCat / V8 兼容引擎包受许可限制），
# 用户首次启动按 docs/quickstart.md 自行接入。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（例如 v0.3.0，必须已存在）
        required: true
        type: string
      draft:
        description: 只生成草稿，不直接发布
        type: boolean
        default: true

jobs:
  build:
    name: 检查并生成安装包
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: 确认不带第三方引擎二进制
        shell: pwsh
        run: |
          $bad = Get-ChildItem src-tauri/engine -Filter *.zip -ErrorAction SilentlyContinue
          if ($bad) {
            Write-Error "仓库中出现了第三方引擎包：$($bad.Name -join ', ')。按第三方许可不得随仓库/安装包分发。"
            exit 1
          }
          $tracked = git ls-files -- '*.zip' '*.exe' '*.dll' '*.silk'
          if ($tracked) {
            Write-Error "仓库跟踪了怀疑为第三方二进制的文件：`n$($tracked -join "`n")"
            exit 1
          }

      - name: 校验 tag 与版本号一致
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}" -replace '^v', ''
          $package = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
            Select-Object -First 1).Matches.Groups[1].Value
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $package -or $tag -ne $cargo -or $tag -ne $tauri) {
            Write-Error "版本不一致：tag=$tag package=$package cargo=$cargo tauri=$tauri"
            exit 1
          }
          "版本一致：$tag"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 前端检查
        run: |
          npm run typecheck
          npm run build

      - name: Rust 检查
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: 编译并打包
        run: npm run build:dist

      - name: 列出产物
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe |
            ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: 校验安装包不含内置引擎
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $sizeMb = $exe.Length / 1MB
          if ($sizeMb -gt 15) {
            Write-Error ("安装包 {0} 为 {1:N1} MB，疑似打进了第三方引擎包" -f $exe.Name, $sizeMb)
            exit 1
          }
          "安装包 {0}：{1:N1} MB，未包含引擎（符合预期）" -f $exe.Name, $sizeMb
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Set-Content SHA256SUMS.txt -Encoding ascii
          if (Test-Path scripts/setup-asr.ps1) {
            $scriptHash = (Get-FileHash scripts/setup-asr.ps1 -Algorithm SHA256).Hash.ToLower()
            "$scriptHash  setup-asr.ps1" | Add-Content SHA256SUMS.txt -Encoding ascii
          }

      - name: 生成发布说明
        shell: pwsh
        run: |
          $version = "${{ inputs.tag || github.ref_name }}" -replace '^v', ''
          $header = @"
          **下载**：[Sylk_${version}_x64-setup.exe](https://github.com/nebula-eng/sylk/releases/tag/v${version})（约 3 MB，未签名，SmartScreen 提示时选「仍要运行」）

          **第一次使用**：[5 分钟快速开始](https://github.com/nebula-eng/sylk/blob/main/docs/quickstart.md) · Windows 10 2004+ / 11 · x64
          **不包含第三方引擎**：需要自备兼容引擎包或 NapCat，说明见 [docs/engine.md](https://github.com/nebula-eng/sylk/blob/main/docs/engine.md)。
          安装包 SHA256 见下方的 SHA256SUMS.txt。

          "@

          $body = $header
          if (Test-Path CHANGELOG.md) {
            $lines = Get-Content CHANGELOG.md
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match "^## \[$([regex]::Escape($version))\]") {
                $start = $i
                break
              }
            }
            if ($start -ge 0) {
              $end = $lines.Count
              for ($i = $start + 1; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match '^## \[') {
                  $end = $i
                  break
                }
              }
              $body = $header + "`n`n" + ($lines[$start..($end - 1)] -join "`n")
            }
          }
          Set-Content -Path release-notes.md -Value $body -Encoding utf8

      - name: 挂到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
            scripts/setup-asr.ps1
          fail_on_unmatched_files: true
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          body_path: release-notes.md
          generate_release_notes: false
