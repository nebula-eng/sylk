name: Release

# 打 tag 就出正式版：编译 Windows 安装包，挂到 GitHub Releases。
# 发布包**不包含**第三方引擎（NapCat / V8 兼容引擎包受许可限制），
# 用户首次启动按 docs/quickstart.md 自行接入。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: 只生成草稿，不直接发布
        type: boolean
        default: true

jobs:
  build:
    name: 生成安装包
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 确认不带第三方引擎二进制
        shell: pwsh
        run: |
          $bad = Get-ChildItem src-tauri/engine -Filter *.zip -ErrorAction SilentlyContinue
          if ($bad) {
            Write-Error "仓库中出现了第三方引擎包：$($bad.Name -join ', ')。按第三方许可不得随仓库/安装包分发。"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 编译并打包
        run: npm run build:dist

      - name: 列出产物
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe |
            ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - name: 校验安装包不含内置引擎
        shell: pwsh
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $sizeMb = $exe.Length / 1MB
          if ($sizeMb -gt 15) {
            Write-Error ("安装包 {0} 为 {1:N1} MB，疑似打进了第三方引擎包" -f $exe.Name, $sizeMb)
            exit 1
          }
          "安装包 {0}：{1:N1} MB，未包含引擎（符合预期）" -f $exe.Name, $sizeMb

      - name: 生成发布说明
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $header = @"
          从源码安装（Windows）：

          1. 安装 Node 20+、Rust、VS Build Tools（勾「使用 C++ 的桌面开发」）
          2. 拉取仓库，双击 ``build.cmd``
          3. 之后从桌面图标打开

          或直接下载下面的 ``Sylk_*_x64-setup.exe``，双击安装。

          > 安装包与仓库都不包含第三方引擎；首次使用请按 docs/quickstart.md 接入。
          "@

          $body = $header
          if (Test-Path CHANGELOG.md) {
            $lines = Get-Content CHANGELOG.md
            $start = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match "^## \[$([regex]::Escape($version))\]") {
                $start = $i
                break
              }
            }
            if ($start -ge 0) {
              $end = $lines.Count
              for ($i = $start + 1; $i -lt $lines.Count; $i++) {
                if ($lines[$i] -match '^## \[') {
                  $end = $i
                  break
                }
              }
              $body = $header + "`n`n" + ($lines[$start..($end - 1)] -join "`n")
            }
          }
          Set-Content -Path release-notes.md -Value $body -Encoding utf8

      - name: 挂到 Releases
        uses: softprops/action-gh-release@v3
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          body_path: release-notes.md
          generate_release_notes: false
